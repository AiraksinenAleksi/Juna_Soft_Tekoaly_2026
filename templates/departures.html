<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departures — {{ station_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <div class="banner">
      <h1>🚆 Departures from {{ station_name }} <small>({{ station_code }})</small></h1>
      <p class="hint">Board refreshes automatically every 60 seconds.</p>
    </div>

    {% if error %}
      <p class="error">⚠️ {{ error }}</p>
    {% endif %}

    <div class="card">
      <div class="switch">
        <form action="{{ url_for('station_select') }}" method="get">
          <label for="switch-code">Switch station:</label>
          <select name="code" id="switch-code" required data-autosubmit>
            <option value="" disabled selected>— choose —</option>
            {% for s in stations %}
              <option value="{{ s.stationShortCode }}"
                      {% if s.stationShortCode == station_code %}selected{% endif %}>
                {{ s.stationName }}
              </option>
            {% endfor %}
          </select>
          <button type="submit">Go</button>
        </form>
      </div>
    </div>

    <div class="filters" role="group" aria-label="Filter trains by category">
      <button type="button" class="filter-pill active" data-filter="passenger" aria-pressed="true">Passenger</button>
      <button type="button" class="filter-pill" data-filter="commuter" aria-pressed="false">Commuter</button>
      <button type="button" class="filter-pill" data-filter="long-distance" aria-pressed="false">Long-distance</button>
      <button type="button" class="filter-pill" data-filter="cargo" aria-pressed="false">Cargo</button>
      <button type="button" class="filter-pill" data-filter="all" aria-pressed="false">All</button>
    </div>

    <div class="table-wrap">
      <table>
        <caption>Next departures from {{ station_name }}</caption>
        <thead>
          <tr>
            <th>Train</th><th>To</th><th>Sched.</th>
            <th>Estimated</th><th>Status</th><th>Track</th>
          </tr>
        </thead>
        <tbody id="departures-body" aria-live="polite"
               data-partial-url="{{ url_for('departures_partial', code=station_code) }}">
          {% include "_rows.html" %}
        </tbody>
      </table>
    </div>

    <p class="back"><a href="{{ url_for('index') }}">← All stations</a></p>
  </div>

  <script src="{{ url_for('static', filename='station-select.js') }}" defer></script>
  <script src="{{ url_for('static', filename='departures.js') }}" defer></script>
</body>
</html>
