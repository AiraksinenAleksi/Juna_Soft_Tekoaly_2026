<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finnish Trains — Station Picker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <div class="banner">
      <h1>🚆 Finnish Railway Departures</h1>
      {% if stations %}
        <p class="hint">{{ stations|length }} passenger stations available.</p>
      {% endif %}
    </div>

    {% if error %}
      <p class="error">⚠️ {{ error }}</p>
    {% endif %}

    <div class="card">
      <form action="{{ url_for('station_select') }}" method="get">
        <label for="code">Select station:</label>
        <select name="code" id="code" required data-autosubmit>
          <option value="" disabled selected>— choose a station —</option>
          {% for s in stations %}
            <option value="{{ s.stationShortCode }}">{{ s.stationName }}</option>
          {% endfor %}
        </select>
        <button type="submit">Show departures</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='station-select.js') }}" defer></script>
</body>
</html>
